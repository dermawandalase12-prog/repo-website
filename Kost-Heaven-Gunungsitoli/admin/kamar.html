<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Kamar - Kost-Heaven</title>
    <link rel="stylesheet" href="../bootstrap-5.3/css/bootstrap.min.css" />
  </head>
  <body class="bg-light">
    <div class="d-flex min-vh-100">
      <aside
        class="bg-white border-end d-none d-lg-block"
        style="width: 250px; flex-shrink: 0"
      >
        <div class="p-3 border-bottom">
          <h5 class="mb-0 text-primary fw-bold">Kost-Heaven</h5>
          <small class="text-muted">Admin Panel</small>
        </div>
        <div id="adminSidebar"></div>
      </aside>

      <div
        class="offcanvas offcanvas-start"
        tabindex="-1"
        id="adminSidebarOffcanvas"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title text-primary fw-bold">Kost-Heaven</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
          ></button>
        </div>
        <div class="offcanvas-body p-0" id="adminSidebarOffcanvasBody"></div>
      </div>

      <div class="flex-grow-1 d-flex flex-column">
        <header
          class="bg-white border-bottom p-3 sticky-top"
          id="adminTopbar"
        ></header>
        <main class="p-3 p-md-4 flex-grow-1">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2"
          >
            <div>
              <h4 class="mb-0">Data Kamar</h4>
              <p class="text-muted small mb-0">
                K01–K06 Lantai 1 Putra; K07–K12 Lantai 2 Putri (tetap).
              </p>
            </div>
          </div>
          <div class="card mb-3">
            <div class="card-body">
              <div class="row g-2">
                <div class="col-md-4">
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    id="akSearch"
                    placeholder="Cari nomor kamar"
                  />
                </div>
                <div class="col-md-3">
                  <select class="form-select form-select-sm" id="akLantai">
                    <option value="">Semua Lantai</option>
                    <option value="1">Lantai 1</option>
                    <option value="2">Lantai 2</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <select class="form-select form-select-sm" id="akKategori">
                    <option value="">Semua Kategori</option>
                    <option value="Putra">Putra</option>
                    <option value="Putri">Putri</option>
                  </select>
                </div>
                <div class="col-md-2">
                  <select class="form-select form-select-sm" id="akStatus">
                    <option value="">Semua Status</option>
                    <option value="Tersedia">Tersedia</option>
                    <option value="Terisi">Terisi</option>
                    <option value="Perbaikan">Perbaikan</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div id="akList"></div>
        </main>
      </div>
    </div>

    <div class="modal fade" id="akEditModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              Edit Kamar <span id="akEditNomor"></span>
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div id="akEditAlert" class="d-none"></div>
            <form id="akEditForm" novalidate>
              <input type="hidden" id="akEditId" />
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nomor Kamar</label>
                  <input
                    type="text"
                    class="form-control"
                    id="akEditNomorInput"
                    readonly
                  />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Lantai</label>
                  <input
                    type="number"
                    class="form-control"
                    id="akEditLantai"
                    readonly
                  />
                </div>
                <div class="col-md-3">
                  <label class="form-label">Kategori</label>
                  <input
                    type="text"
                    class="form-control"
                    id="akEditKategori"
                    readonly
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Tipe</label>
                  <input type="text" class="form-control" id="akEditTipe" />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Harga Tahunan</label>
                  <input
                    type="number"
                    class="form-control"
                    id="akEditHarga"
                    min="0"
                    step="100000"
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Status</label>
                  <select class="form-select" id="akEditStatus">
                    <option value="Tersedia">Tersedia</option>
                    <option value="Terisi">Terisi</option>
                    <option value="Perbaikan">Perbaikan</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label"
                    >Fasilitas (pisahkan dengan koma)</label
                  >
                  <textarea
                    class="form-control"
                    id="akEditFasilitas"
                    rows="2"
                  ></textarea>
                </div>

                <div class="col-12">
                  <label class="form-label">Upload Foto Kamar</label>
                  <input
                    type="file"
                    class="form-control"
                    id="akEditFotoFile"
                    accept="image/*"
                  />
                  <div class="form-text">
                    Pilih file untuk mengunggah foto baru dari komputer.
                  </div>
                  <div class="mt-2">
                    <img
                      id="akEditFotoPreview"
                      src=""
                      class="img-thumbnail d-none"
                      style="max-height: 150px"
                      alt="Preview"
                    />
                  </div>
                </div>

                <div class="col-12">
                  <label class="form-label">Deskripsi</label>
                  <textarea
                    class="form-control"
                    id="akEditDeskripsi"
                    rows="2"
                  ></textarea>
                </div>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Batal
            </button>
            <button type="button" class="btn btn-primary" id="akEditSaveBtn">
              Simpan
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="akToast"
        class="toast align-items-center text-bg-success border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="akToastBody"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <script src="../bootstrap-5.3/js/bootstrap.bundle.min.js"></script>
    <script src="../js/database.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
    <script>
      (function () {
        function toast(msg) {
          document.getElementById("akToastBody").textContent = msg;
          bootstrap.Toast.getOrCreateInstance(
            document.getElementById("akToast"),
          ).show();
        }

        function render() {
          var rooms = DB.getRooms();
          var s = document.getElementById("akSearch").value.toLowerCase();
          var l = document.getElementById("akLantai").value;
          var k = document.getElementById("akKategori").value;
          var st = document.getElementById("akStatus").value;

          if (s)
            rooms = rooms.filter(function (r) {
              return r.nomorKamar.toLowerCase().indexOf(s) !== -1;
            });
          if (l)
            rooms = rooms.filter(function (r) {
              return String(r.lantai) === l;
            });
          if (k)
            rooms = rooms.filter(function (r) {
              return r.kategori === k;
            });
          if (st)
            rooms = rooms.filter(function (r) {
              return r.status === st;
            });

          var wrap = document.getElementById("akList");
          if (!rooms.length) {
            wrap.innerHTML =
              '<div class="alert alert-warning">Tidak ada kamar.</div>';
            return;
          }

          var h =
            '<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">';
          rooms.forEach(function (r) {
            var badge =
              r.status === "Tersedia"
                ? "bg-success"
                : r.status === "Terisi"
                  ? "bg-info text-dark"
                  : "bg-warning text-dark";
            var tenantNames = (r.tenantIds || [])
              .map(function (id) {
                var t = DB.getTenantById(id);
                return t ? t.nama : id;
              })
              .join(", ");
            h +=
              '<div class="col"><div class="card h-100"><div class="card-body">' +
              '<div class="d-flex justify-content-between align-items-start mb-2">' +
              '<h5 class="mb-0">' +
              AdminApp.escapeHtml(r.nomorKamar) +
              "</h5>" +
              '<span class="badge ' +
              badge +
              '">' +
              AdminApp.escapeHtml(r.status) +
              "</span>" +
              "</div>" +
              '<p class="text-muted small mb-1">Lantai ' +
              r.lantai +
              " · " +
              AdminApp.escapeHtml(r.kategori) +
              " · " +
              AdminApp.escapeHtml(r.tipe || "Standar") +
              "</p>" +
              '<p class="fw-bold text-primary mb-1">' +
              DB.formatRupiah(r.hargaTahunan) +
              "/tahun</p>" +
              '<p class="small text-muted mb-2">Penghuni: ' +
              AdminApp.escapeHtml(tenantNames || "-") +
              "</p>" +
              '<button class="btn btn-sm btn-outline-primary w-100 btn-edit" data-id="' +
              AdminApp.escapeHtml(r.id) +
              '">Edit Kamar</button>' +
              "</div></div></div>";
          });
          h += "</div>";
          wrap.innerHTML = h;

          wrap.querySelectorAll(".btn-edit").forEach(function (btn) {
            btn.addEventListener("click", function () {
              openEdit(btn.getAttribute("data-id"));
            });
          });
        }

        function openEdit(id) {
          var r = DB.getRoomById(id);
          if (!r) return;

          document.getElementById("akEditId").value = r.id;
          document.getElementById("akEditNomor").textContent = r.nomorKamar;
          document.getElementById("akEditNomorInput").value = r.nomorKamar;
          document.getElementById("akEditLantai").value = r.lantai;
          document.getElementById("akEditKategori").value = r.kategori;
          document.getElementById("akEditTipe").value = r.tipe || "";
          document.getElementById("akEditHarga").value = r.hargaTahunan;
          document.getElementById("akEditStatus").value = r.status;
          document.getElementById("akEditFasilitas").value = (
            r.fasilitas || []
          ).join(", ");
          document.getElementById("akEditDeskripsi").value = r.deskripsi || "";

          document.getElementById("akEditFotoFile").value = "";

          var preview = document.getElementById("akEditFotoPreview");
          if (r.foto) {
            if (r.foto.indexOf("data:") === 0) {
              preview.src = r.foto;
            } else {
              preview.src =
                r.foto.indexOf("images/") === 0 ? "../" + r.foto : r.foto;
            }
            preview.classList.remove("d-none");
          } else {
            preview.src = "";
            preview.classList.add("d-none");
          }

          document.getElementById("akEditAlert").classList.add("d-none");
          bootstrap.Modal.getOrCreateInstance(
            document.getElementById("akEditModal"),
          ).show();
        }

        document
          .getElementById("akEditFotoFile")
          .addEventListener("change", function (e) {
            var file = e.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
              alert("Ukuran foto maksimal 2MB");
              this.value = "";
              return;
            }

            var reader = new FileReader();
            reader.onload = function (ev) {
              var img = new Image();
              img.onload = function () {
                var canvas = document.createElement("canvas");
                var ctx = canvas.getContext("2d");
                var maxWidth = 800;
                var scale = Math.min(1, maxWidth / img.width);
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                var dataUrl = canvas.toDataURL("image/jpeg", 0.7);

                var preview = document.getElementById("akEditFotoPreview");
                preview.src = dataUrl;
                preview.classList.remove("d-none");
              };
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          });

        document
          .getElementById("akEditSaveBtn")
          .addEventListener("click", function () {
            var rooms = DB.getRooms();
            var idx = rooms.findIndex(function (x) {
              return x.id === document.getElementById("akEditId").value;
            });
            if (idx < 0) return;

            var harga = Number(document.getElementById("akEditHarga").value);
            if (!harga || harga <= 0) {
              var a = document.getElementById("akEditAlert");
              a.className = "alert alert-danger";
              a.textContent = "Harga harus lebih dari 0.";
              a.classList.remove("d-none");
              return;
            }

            rooms[idx].tipe =
              document.getElementById("akEditTipe").value.trim() || "Standar";
            rooms[idx].hargaTahunan = harga;
            rooms[idx].status = document.getElementById("akEditStatus").value;
            rooms[idx].fasilitas = document
              .getElementById("akEditFasilitas")
              .value.split(",")
              .map(function (x) {
                return x.trim();
              })
              .filter(Boolean);
            rooms[idx].deskripsi = document
              .getElementById("akEditDeskripsi")
              .value.trim();

            var previewSrc = document.getElementById("akEditFotoPreview").src;
            if (previewSrc && previewSrc.indexOf("data:") === 0) {
              rooms[idx].foto = previewSrc;
            }

            if (DB.saveRooms(rooms)) {
              bootstrap.Modal.getInstance(
                document.getElementById("akEditModal"),
              ).hide();
              toast("Kamar berhasil diperbarui.");
              render();
            } else {
              var a2 = document.getElementById("akEditAlert");
              a2.className = "alert alert-danger";
              a2.textContent =
                "Gagal menyimpan data. LocalStorage mungkin penuh.";
              a2.classList.remove("d-none");
            }
          });

        ["akSearch", "akLantai", "akKategori", "akStatus"].forEach(
          function (id) {
            document.getElementById(id).addEventListener("input", render);
            document.getElementById(id).addEventListener("change", render);
          },
        );

        document.addEventListener("DOMContentLoaded", function () {
          AdminApp.initAdminPage("kamar.html", "Data Kamar");
          render();
        });
      })();
    </script>
  </body>
</html>
